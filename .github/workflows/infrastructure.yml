# Infrastructure CI/CD (PROMPT.md §33, §36):
#   bicep build + lint (pull requests and main) → deploy dev on main (every deploy job prints its
#   own what-if before `az deployment group create`).
# Production infrastructure ships with an application release (release-production.yml). A manual
# run (main only, waits for the prod reviewers) changes prod configuration between releases, such
# as the notifications mode or a recovery hold, and keeps the running image.
# Trust: pull requests get no Azure credential. ARM what-if needs write permission on every
# resource in the template, so there is no read-only preview identity (D145); the deploying
# environments `dev` and `prod` accept only the protected main branch (docs/github-setup.md).
name: infrastructure

on:
  push:
    branches: [main]
    paths:
      - "infrastructure/**"
      - ".github/workflows/infrastructure.yml"
      - ".github/workflows/reusable-infrastructure.yml"
  pull_request:
    paths:
      - "infrastructure/**"
      - ".github/workflows/infrastructure.yml"
      - ".github/workflows/reusable-infrastructure.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        required: true
        type: choice
        options: [dev, prod]
      what_if_only:
        description: Stop after what-if
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: infrastructure-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: bicep build and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Bicep
        run: az bicep install && az bicep version
      - name: Build and lint every Bicep file
        working-directory: infrastructure
        run: |
          out="${RUNNER_TEMP}/bicep"
          mkdir -p "$out"
          for file in main.bicep modules/*.bicep; do
            echo "::group::${file}"
            az bicep build --file "$file" --outdir "$out"
            az bicep lint --file "$file" --diagnostics-format sarif > "${out}/$(basename "$file").sarif"
            echo "::endgroup::"
          done
          for file in parameters/*.bicepparam; do
            az bicep build-params --file "$file" --outfile "${out}/$(basename "$file").json"
          done
      - name: Security properties of the compiled template
        run: |
          python3 infrastructure/scripts/check-template-security.py "${RUNNER_TEMP}/bicep/main.json"
          python3 infrastructure/scripts/check-template-security.py "${RUNNER_TEMP}/bicep/main.json" --self-test
      - name: Check the deployment scripts
        run: |
          for script in infrastructure/scripts/*.sh; do bash -n "$script"; done
          shellcheck infrastructure/scripts/*.sh backend/entrypoint.sh backend/requirements/lock.sh
      - name: Test the release tooling
        run: |
          git config --global user.email "ci@example.test"
          git config --global user.name "ci"
          python3 -m unittest discover -s infrastructure/tests -v

  manual:
    name: manual run
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-infrastructure.yml
    # The reusable workflow's secrets come only from the caller: without this, ALERT_EMAIL resolves to ''.
    secrets: inherit
    with:
      environment: ${{ inputs.environment }}
      what_if_only: ${{ inputs.what_if_only }}

  deploy-dev:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-infrastructure.yml
    # The reusable workflow's secrets come only from the caller: without this, ALERT_EMAIL resolves to ''.
    secrets: inherit
    with:
      environment: dev
      what_if_only: false
