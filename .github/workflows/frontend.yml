# Frontend CI/CD (PROMPT.md §36):
#   npm ci → lint → type check → unit tests → rtl_check.py → build → Azure Static Web Apps
# One build artifact is promoted dev → staging → prod (prod waits for the environment's
# required reviewers). The SPA has no environment-specific build settings: it calls /api on
# its own origin (Static Web Apps linked backend).
name: frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
      - ".github/workflows/reusable-deploy-frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
      - ".github/workflows/reusable-deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: lint, type check, test, rtl check, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22" # latest 22.x LTS (Q-T9)
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12" # rtl_check.py
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run rtl:check
      - run: npm run build
      - name: Upload the build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  deploy-dev:
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-deploy-frontend.yml
    with:
      environment: dev

  deploy-staging:
    needs: deploy-dev
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-deploy-frontend.yml
    with:
      environment: staging

  deploy-prod:
    needs: deploy-staging
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-deploy-frontend.yml
    with:
      environment: prod
