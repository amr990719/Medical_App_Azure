# End-to-end tests (PROMPT.md §36, optional job): a fresh docker compose stack (PostgreSQL,
# Azurite, Django with development settings, DEV_AUTH_ENABLED and the mock OCR provider) +
# the Vite dev server (Playwright's webServer) + Playwright. A new stack per run, so reference
# numbers and e2e users never accumulate (Q-T12). No Azure access, no secrets. Pushes to main run
# it too: a production release requires this run for the exact commit it promotes.
name: e2e

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/e2e.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # By commit on main: GitHub replaces a pending run in the same group even without
  # cancel-in-progress, and a commit without its run could never be released.
  group: e2e-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  playwright:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start PostgreSQL, Azurite and Django
        run: docker compose up --detach --build --wait postgres azurite && docker compose up --detach --build backend
      - name: Wait for the backend
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/ready/ >/dev/null; then
              echo "backend ready after ${attempt} attempts"
              exit 0
            fi
            sleep 3
          done
          docker compose logs backend
          exit 1
      - name: Backend tests that need Azurite
        run: docker compose exec -T backend pytest -q -m azurite --ds=config.settings.test
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: frontend
        run: npm run test:e2e
      - name: Backend logs
        if: failure()
        run: docker compose logs backend
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
