# Deploys the `frontend-dist` artifact of the calling run to one environment's Static Web App.
# Azure access is GitHub OIDC only (no stored passwords); the Static Web Apps deployment token
# is read at run time with that identity, masked, and never stored as a GitHub secret.
#
# GitHub environment variables used: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
# AZURE_RESOURCE_GROUP, STATIC_WEB_APP_NAME (docs/github-setup.md).
name: deploy frontend

on:
  workflow_call:
    inputs:
      environment:
        description: dev, staging or prod
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: deploy to ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment }}
    concurrency:
      group: deploy-frontend-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      STATIC_WEB_APP_NAME: ${{ vars.STATIC_WEB_APP_NAME }}
    steps:
      - name: Check environment variables
        run: |
          for name in RESOURCE_GROUP STATIC_WEB_APP_NAME; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub environment '${{ inputs.environment }}' is missing a variable for ${name} (docs/github-setup.md)"
              exit 1
            fi
          done
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: dist
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Read the deployment token
        run: |
          token="$(az staticwebapp secrets list --name "$STATIC_WEB_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" --query properties.apiKey -o tsv)"
          echo "::add-mask::${token}"
          echo "SWA_DEPLOYMENT_TOKEN=${token}" >> "$GITHUB_ENV"
      - name: Upload to Static Web Apps
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          action: upload
          azure_static_web_apps_api_token: ${{ env.SWA_DEPLOYMENT_TOKEN }}
          app_location: dist
          output_location: ""
          skip_app_build: true
      - name: Smoke test
        run: |
          host="$(az staticwebapp show --name "$STATIC_WEB_APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --query defaultHostname -o tsv)"
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors -o /dev/null "https://${host}/"
          headers="$(curl -fsSI "https://${host}/")"
          echo "$headers" | grep -qi '^content-security-policy:' || { echo "::error::CSP header missing"; exit 1; }
          echo "https://${host}/ is up with its security headers"
